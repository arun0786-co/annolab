[project]
name = "annolab"
version = "0.1.0"
description = "Multimodal data labeling platform backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "shapely>=2.0",
    "scikit-image>=0.24",
    "email-validator>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pycocotools>=2.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["annolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::DeprecationWarning:pycocotools",
]
